[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
axum = { version = "0.8.4" }
tokio = { version = "1", features = ["full"] }
log = "0.4"
notify = "8.0.0"
slab = "0.4"
itertools = "0.14.0"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
futures-util = "0.3.31"
rayon = "1.10"
# Only alloy::primitives::Address is used; "full" pulled in sol-macro (and proc-macro-error2,
# flagged future-incompatible by rustc 1.99) plus the provider/contract stack for nothing.
alloy = { version = "1.0.22", default-features = false, features = ["std", "serde"] }
strum_macros = "0.27.2"
yawc = { version = "0.3.2", features = ["axum"] }
flate2 = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6.0"
prometheus = "0.14"
lazy_static = "1.4"
sonic-rs = "0.3"
rustc-hash = "2"
bytes = "1"
# Streaming decode of the node's MessagePack checkpoints (accounts module).
rmp-serde = "1.3"
# Local marks' venue feeds (design 000454): WS through yawc; the two REST calls (MEXC spot, Kucoin token) over the
# HTTP and TLS crates yawc already brings in.
url = "2"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
webpki-roots = "1"

[dev-dependencies]
# test-util enables tokio::test(start_paused) so timeout-path tests (writer
# wedged on a never-ready sink) run instantly instead of real-time 5s waits.
tokio = { version = "1", features = ["full", "test-util"] }

[lints]
workspace = true
